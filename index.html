<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Past Papers — Examinations.ie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Past Papers</h1>
    <p class="tagline">A simpler way to find exam papers from <a href="https://www.examinations.ie/exammaterialarchive/" target="_blank" rel="noopener">examinations.ie</a></p>
  </header>

  <main>
    <section class="filters" aria-label="Filter papers">
      <label>
        <span>Examination</span>
        <select id="course" aria-label="Examination">
          <option value="">— Select examination —</option>
          <option value="jc">Junior Certificate</option>
          <option value="lc">Leaving Certificate</option>
          <option value="lb">Leaving Certificate Applied</option>
        </select>
      </label>
      <label>
        <span>Subject</span>
        <select id="subject" aria-label="Subject" disabled>
          <option value="">— Select subject —</option>
        </select>
      </label>
      <label>
        <span>Year</span>
        <select id="year" aria-label="Year" disabled>
          <option value="">— Select year —</option>
        </select>
      </label>
      <label>
        <span>Level</span>
        <select id="level" aria-label="Level" disabled>
          <option value="">— Select level —</option>
        </select>
      </label>
      <label>
        <span>Language</span>
        <select id="language" aria-label="Language" disabled>
          <option value="">— Select language —</option>
        </select>
      </label>
      <label>
        <span>Material type</span>
        <select id="materialType" aria-label="Material type" disabled>
          <option value="">— Select material type —</option>
        </select>
      </label>
    </section>

    <section class="results" aria-live="polite">
      <div id="results-loading" class="results-loading hidden" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <span>Loading…</span>
      </div>
      <div id="results-empty" class="results-empty hidden">
        <p>No papers found for this combination.</p>
      </div>
      <div id="results-list" class="results-list hidden">
        <h2 class="results-title">Papers</h2>
        <ul id="papers-list" class="papers-list"></ul>
      </div>
    </section>
  </main>

  <footer class="footer">
    <a href="https://github.com/vivantaneja/Past-Examination-Finder" target="_blank" rel="noopener" aria-label="GitHub">
      <svg class="footer-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
      GitHub
    </a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
